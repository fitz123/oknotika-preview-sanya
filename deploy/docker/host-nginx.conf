# Install as /etc/nginx/conf.d/oknotika-docker.conf after both certificates exist.
# This complete file belongs in nginx's http context.

limit_req_zone $binary_remote_addr zone=oknotika_docker_admin_general:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=oknotika_docker_admin_login:10m rate=5r/m;
limit_conn_zone $server_name zone=oknotika_docker_admin_uploads:10m;

upstream oknotika_docker_admin {
    server 127.0.0.1:8000;
    keepalive 8;
}

upstream oknotika_docker_public {
    server 127.0.0.1:8001;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.oknotika.ru;
    return 308 https://admin.oknotika.ru$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name oknotika.ru www.oknotika.ru;
    return 308 https://oknotika.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.oknotika.ru;

    ssl_certificate /etc/letsencrypt/live/oknotika.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oknotika.ru/privkey.pem;
    return 308 https://oknotika.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name oknotika.ru;

    ssl_certificate /etc/letsencrypt/live/oknotika.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oknotika.ru/privkey.pem;

    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://oknotika_docker_public;
        proxy_http_version 1.1;
        proxy_set_header Host oknotika.ru;
        proxy_set_header X-Forwarded-Host oknotika.ru;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.oknotika.ru;

    ssl_certificate /etc/letsencrypt/live/admin.oknotika.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.oknotika.ru/privkey.pem;
    client_max_body_size 1m;
    limit_req_status 429;

    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; script-src 'self'; style-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location = /auth/start {
        limit_req zone=oknotika_docker_admin_login burst=3 nodelay;
        proxy_pass http://oknotika_docker_admin;
        proxy_http_version 1.1;
        proxy_set_header Host admin.oknotika.ru;
        proxy_set_header X-Forwarded-Host admin.oknotika.ru;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    location = /auth/callback {
        access_log off;
        error_log /dev/null crit;
        limit_req zone=oknotika_docker_admin_login burst=3 nodelay;
        proxy_pass http://oknotika_docker_admin;
        proxy_http_version 1.1;
        proxy_set_header Host admin.oknotika.ru;
        proxy_set_header X-Forwarded-Host admin.oknotika.ru;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    location = /api/uploads {
        client_max_body_size 10m;
        limit_conn oknotika_docker_admin_uploads 2;
        limit_req zone=oknotika_docker_admin_general burst=5 nodelay;
        proxy_pass http://oknotika_docker_admin;
        proxy_http_version 1.1;
        proxy_set_header Host admin.oknotika.ru;
        proxy_set_header X-Forwarded-Host admin.oknotika.ru;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        limit_req zone=oknotika_docker_admin_general burst=30 nodelay;
        proxy_pass http://oknotika_docker_admin;
        proxy_http_version 1.1;
        proxy_set_header Host admin.oknotika.ru;
        proxy_set_header X-Forwarded-Host admin.oknotika.ru;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
