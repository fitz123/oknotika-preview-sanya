worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    sendfile on;
    server_tokens off;
    access_log /dev/stdout;

    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8001;
        server_name _;
        root /var/home/oknotika/public-app;
        index index.html;
        etag on;

        include /etc/nginx/snippets/oknotika-public-security-headers.conf;

        location = /healthz {
            access_log off;
            add_header Cache-Control "no-store" always;
            return 204;
        }

        location = /articles {
            return 308 /articles/;
        }

        location ~ "^/articles/assets/(?<article_asset>[0-9a-f]{24}\.(?:jpg|png|webp))$" {
            root /var/home/oknotika/admin-app/data/article-releases/active;
            try_files $uri @bundled_article_file;
            include /etc/nginx/snippets/oknotika-public-security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location ~ ^/articles/(?<article_slug>[a-z0-9]+(?:-[a-z0-9]+)*)/$ {
            error_page 418 =410 /articles/$article_slug/index.html;
            if (-f /var/home/oknotika/admin-app/data/article-releases/active/withdrawn/$article_slug) {
                return 418;
            }
            root /var/home/oknotika/admin-app/data/article-releases/active;
            try_files $uri/index.html @bundled_article_page;
            include /etc/nginx/snippets/oknotika-public-security-headers.conf;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
        }

        location /articles/ {
            root /var/home/oknotika/admin-app/data/article-releases/active;
            try_files $uri $uri/index.html @bundled_article_file;
            include /etc/nginx/snippets/oknotika-public-security-headers.conf;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
        }

        location @bundled_article_page {
            root /var/home/oknotika/public-app;
            try_files $uri/index.html =404;
            include /etc/nginx/snippets/oknotika-public-security-headers.conf;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
        }

        location @bundled_article_file {
            root /var/home/oknotika/public-app;
            try_files $uri $uri/index.html =404;
            include /etc/nginx/snippets/oknotika-public-security-headers.conf;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
        }

        location / {
            try_files $uri $uri/ =404;
            include /etc/nginx/snippets/oknotika-public-security-headers.conf;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
        }
    }
}
