<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Вход в редактор новостей · ОКНОТИКА</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body class="login-page">
  <main class="login-card">
    <p class="brand">ОКНОТИКА</p>
    <p class="eyebrow">Закрытый редактор</p>
    <h1>Новости</h1>
    <p>Черновики «Дайджеста недели», предпросмотр и ручная публикация.</p>
    <p class="login-card__security">Доступ разрешён только редактору с локальной учётной записью.</p>
    {{loginError}}
    <form class="login-form" method="post" action="/login">
      <input type="hidden" name="csrf" value="{{csrfToken}}">
      <label class="field">
        <span>Логин</span>
        <input name="username" type="text" autocomplete="username" required autofocus>
      </label>
      <label class="field">
        <span>Пароль</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="button button--primary" type="submit">Войти</button>
    </form>
  </main>
</body>
</html>
