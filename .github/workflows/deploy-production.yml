name: Production deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: oknotika-production
  cancel-in-progress: false

jobs:
  ci:
    name: Reuse secret-free CI gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build immutable deployment artifact
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the approved main commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and verify the SHA-addressed bundle
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          mkdir -p var/deploy-artifact
          python3 scripts/build_ci_bundle.py \
            --repo . \
            --commit "$RELEASE_SHA" \
            --output "var/deploy-artifact/$RELEASE_SHA.zip"
          python3 scripts/check_ci_bundle.py \
            "var/deploy-artifact/$RELEASE_SHA.zip" \
            --expected-commit "$RELEASE_SHA"
          cd var/deploy-artifact
          sha256sum "$RELEASE_SHA.zip" > "$RELEASE_SHA.zip.sha256"
          sha256sum -c "$RELEASE_SHA.zip.sha256"

      - name: Store the immutable bundle and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oknotika-ci-${{ github.sha }}
          path: |
            var/deploy-artifact/${{ github.sha }}.zip
            var/deploy-artifact/${{ github.sha }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  deploy:
    name: Deploy approved production commit
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out the reviewed deployment helper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download the exact build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: oknotika-ci-${{ github.sha }}
          path: var/deploy-artifact

      - name: Upload and invoke the restricted server primitive
        env:
          RELEASE_SHA: ${{ github.sha }}
          DEPLOY_HOST: ${{ secrets.OKNOTIKA_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.OKNOTIKA_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.OKNOTIKA_DEPLOY_USER }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.OKNOTIKA_DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.OKNOTIKA_DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          key_path="$RUNNER_TEMP/oknotika-deploy-key"
          known_hosts_path="$RUNNER_TEMP/oknotika-known-hosts"
          cleanup_credentials() {
            rm -f -- "$key_path" "$known_hosts_path"
          }
          trap cleanup_credentials EXIT
          umask 077
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$key_path"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_path"
          deploy/cicd/upload-and-deploy.sh \
            --bundle "$GITHUB_WORKSPACE/var/deploy-artifact/$RELEASE_SHA.zip" \
            --checksum-file "$GITHUB_WORKSPACE/var/deploy-artifact/$RELEASE_SHA.zip.sha256" \
            --release-sha "$RELEASE_SHA" \
            --host "$DEPLOY_HOST" \
            --port "$DEPLOY_PORT" \
            --user "$DEPLOY_USER" \
            --identity-file "$key_path" \
            --known-hosts "$known_hosts_path" \
            --remote-incoming /var/lib/oknotika-deploy/incoming
